[package]
name = "mcpant"
version = "0.0.2"
edition = "2024"
description = "Reserved name: a Model Context Protocol library (client and server) for Rust. Placeholder, no functionality yet."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/mcpant"
readme = "README.md"

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
serde_json = "1"
rmcp = { version = "3.11", features = ["server", "macros", "transport-async-rw"] }
tokio = { version = "1", features = ["rt", "macros", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
